services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minieft
      POSTGRES_USER: minieft
      POSTGRES_PASSWORD: minieft
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minieft"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=minieft;Username=minieft;Password=minieft"
    ports: ["8080:8080"]

volumes:
  pgdata:
